<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Typetodo 高保真原型 v0.1</title>
<style>
  :root {
    --bg: #F4F4F1;
    --win: #FFFFFF;
    --side: #F3F3F0;
    --line: rgba(0,0,0,.07);
    --line-strong: rgba(0,0,0,.12);
    --text: #1C1C1E;
    --text2: #6C6C70;
    --text3: #9A9A9F;
    --accent: #0D9488;
    --accent-strong: #0B7C72;
    --accent-soft: #E6F6F3;
    --danger: #D2453F;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background:
      radial-gradient(1200px 600px at 20% -10%, #EDF7F4 0%, transparent 60%),
      var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Helvetica Neue", sans-serif;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 24px 56px;
  }

  .stage { position: relative; width: 1180px; max-width: 100%; }

  .window {
    width: 1180px;
    height: 744px;
    max-width: 100%;
    background: var(--win);
    border-radius: 14px;
    box-shadow: 0 28px 70px rgba(20,30,28,.20), 0 2px 6px rgba(20,30,28,.08);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    border: 1px solid rgba(0,0,0,.06);
  }

  .titlebar {
    height: 50px;
    flex: 0 0 50px;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 0 16px;
    border-bottom: 1px solid var(--line);
    background: #FBFBF9;
  }
  .lights { display: flex; gap: 8px; }
  .lights i { width: 12px; height: 12px; border-radius: 50%; display: block; }
  .lights .r { background: #FF5F57; }
  .lights .y { background: #FEBC2E; }
  .lights .g { background: #28C840; }
  .app-name { font-size: 13px; font-weight: 600; color: var(--text2); letter-spacing: .2px; margin-left: 2px; }
  .titlebar .spacer { flex: 1; }
  .tools { display: flex; align-items: center; gap: 8px; }

  button { font: inherit; cursor: pointer; border: none; background: none; color: inherit; }
  .btn {
    height: 30px;
    padding: 0 12px;
    border-radius: 7px;
    font-size: 12.5px;
    font-weight: 500;
    color: var(--text2);
    border: 1px solid var(--line-strong);
    background: #fff;
    transition: background .12s, border-color .12s, color .12s;
    white-space: nowrap;
  }
  .btn:hover { background: #F6F6F3; color: var(--text); }
  .btn.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  .btn.primary:hover { background: var(--accent-strong); }
  .btn kbd {
    font-family: inherit;
    font-size: 11px;
    opacity: .8;
    margin-right: 4px;
  }

  .body { flex: 1; display: flex; min-height: 0; }

  .sidebar {
    width: 236px;
    flex: 0 0 236px;
    background: var(--side);
    border-right: 1px solid var(--line);
    padding: 14px 10px 12px;
    display: flex;
    flex-direction: column;
    gap: 2px;
    overflow-y: auto;
  }
  .side-title {
    font-size: 11px;
    font-weight: 600;
    color: var(--text3);
    padding: 12px 10px 6px;
    letter-spacing: .3px;
  }
  .side-item {
    display: flex;
    align-items: center;
    gap: 9px;
    height: 32px;
    padding: 0 10px;
    border-radius: 7px;
    font-size: 13px;
    color: var(--text);
    cursor: pointer;
    user-select: none;
    transition: background .12s;
  }
  .side-item:hover { background: rgba(0,0,0,.045); }
  .side-item.active { background: rgba(13,148,136,.13); color: var(--accent-strong); font-weight: 600; }
  .side-item .ic { width: 16px; height: 16px; flex: 0 0 16px; display: grid; place-items: center; opacity: .75; }
  .side-item.active .ic { opacity: 1; }
  .side-item svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .side-item .label { flex: 1; }
  .side-item .count { font-size: 11.5px; color: var(--text3); font-variant-numeric: tabular-nums; }
  .side-item.active .count { color: var(--accent-strong); }
  .side-item .dot { width: 7px; height: 7px; border-radius: 50%; }
  .side-foot { margin-top: auto; padding-top: 10px; border-top: 1px solid var(--line); }

  .list-pane {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    border-right: 1px solid var(--line);
  }
  .list-head {
    padding: 26px 28px 12px;
    display: flex;
    align-items: flex-end;
    gap: 12px;
  }
  .list-head h1 { margin: 0; font-size: 25px; font-weight: 700; letter-spacing: -.3px; }
  .list-head .sub { font-size: 12.5px; color: var(--text3); padding-bottom: 4px; }
  .list-head .spacer { flex: 1; }
  .list-head .hint { font-size: 12px; color: var(--text3); padding-bottom: 5px; }

  .list-scroll { flex: 1; overflow-y: auto; padding: 4px 18px 28px; }
  .group-head {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 16px 10px 8px;
    font-size: 11.5px;
    font-weight: 600;
    color: var(--text3);
    letter-spacing: .3px;
  }
  .group-head .n { color: var(--text3); font-weight: 500; }
  .group-head.overdue { color: var(--danger); }
  .group-head.overdue .n { color: var(--danger); opacity: .8; }

  .row {
    display: flex;
    align-items: center;
    gap: 13px;
    padding: 11px 12px;
    border-radius: 9px;
    cursor: pointer;
    transition: background .12s;
    position: relative;
  }
  .row:hover { background: #F7F7F4; }
  .row.selected { background: var(--accent-soft); }
  .row.selected::before {
    content: "";
    position: absolute; left: 0; top: 12px; bottom: 12px;
    width: 3px; border-radius: 3px; background: var(--accent);
  }
  .check {
    width: 18px; height: 18px; flex: 0 0 18px;
    border-radius: 50%;
    border: 1.5px solid #C9C9C4;
    display: grid; place-items: center;
    transition: border-color .12s, background .12s;
    padding: 0;
  }
  .check:hover { border-color: var(--accent); }
  .check svg { width: 10px; height: 10px; stroke: #fff; stroke-width: 2.4; fill: none; stroke-linecap: round; stroke-linejoin: round; opacity: 0; }
  .row.done .check { background: var(--accent); border-color: var(--accent); }
  .row.done .check svg { opacity: 1; }
  .row.done .row-title { color: var(--text3); text-decoration: line-through; }

  .row-main { flex: 1; min-width: 0; }
  .row-title {
    font-size: 14px; font-weight: 500; line-height: 1.35;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .row-meta {
    display: flex; align-items: center; gap: 7px;
    margin-top: 3px; font-size: 12px; color: var(--text3);
  }
  .row-meta .due { color: var(--accent-strong); font-weight: 500; }
  .row-meta .due.overdue { color: var(--danger); }
  .row-meta .sep { width: 2px; height: 2px; border-radius: 50%; background: #CFCFCA; }
  .row-right { font-size: 11.5px; color: var(--text3); display: flex; align-items: center; gap: 8px; }
  .pill {
    font-size: 10.5px; padding: 2px 7px; border-radius: 999px;
    background: #F0F0EC; color: var(--text2); white-space: nowrap;
  }
  .pill.warn { background: #FBEDEC; color: var(--danger); }

  .detail {
    width: 340px; flex: 0 0 340px;
    padding: 26px 24px 20px;
    display: flex; flex-direction: column;
    overflow-y: auto;
    background: #FCFCFA;
  }
  .detail .empty { margin: auto; text-align: center; color: var(--text3); font-size: 13px; line-height: 1.9; }
  .detail .empty .k { display: block; margin-top: 8px; font-size: 11.5px; color: #B4B4AF; }
  .d-title { font-size: 20px; font-weight: 650; line-height: 1.35; margin: 0 0 14px; letter-spacing: -.2px; }
  .d-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 22px; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    height: 28px; padding: 0 10px; border-radius: 7px;
    background: #F2F2EE; font-size: 12px; color: var(--text2);
  }
  .chip svg { width: 13px; height: 13px; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; opacity: .8; }
  .chip.accent { background: var(--accent-soft); color: var(--accent-strong); }
  .chip.danger { background: #FBEDEC; color: var(--danger); }
  .chip.add { background: #fff; border: 1px dashed #D2D2CB; color: var(--text2); }
  .d-section { margin-bottom: 20px; }
  .d-label { font-size: 11px; font-weight: 600; color: var(--text3); letter-spacing: .3px; margin-bottom: 8px; }
  .quote {
    border-left: 2px solid #E2E2DC;
    padding: 2px 0 2px 10px;
    font-size: 12.5px; line-height: 1.75; color: var(--text2);
  }
  .d-row {
    display: flex; align-items: center; justify-content: space-between;
    height: 38px; font-size: 13px;
  }
  .d-row .k { color: var(--text2); }
  .switch { width: 36px; height: 21px; border-radius: 999px; background: var(--accent); position: relative; }
  .switch::after {
    content: ""; position: absolute; top: 2px; right: 2px;
    width: 17px; height: 17px; border-radius: 50%; background: #fff;
    box-shadow: 0 1px 2px rgba(0,0,0,.2);
  }
  .d-actions { margin-top: auto; display: flex; gap: 8px; padding-top: 16px; border-top: 1px solid var(--line); }
  .d-actions .btn { flex: 1; justify-content: center; height: 34px; }
  .d-actions .btn.danger { color: var(--danger); border-color: #EBD5D3; }
  .d-actions .btn.danger:hover { background: #FCF1F0; }

  .capsule {
    position: absolute; left: 50%; bottom: 34px; transform: translate(-50%, 24px);
    display: flex; align-items: center; gap: 12px;
    background: #1C1C1E; color: #fff;
    padding: 11px 18px 11px 16px;
    border-radius: 999px;
    box-shadow: 0 12px 30px rgba(0,0,0,.28);
    opacity: 0; pointer-events: none;
    transition: opacity .18s ease, transform .24s cubic-bezier(.2,.9,.3,1.2);
    z-index: 40;
  }
  .capsule.show { opacity: 1; transform: translate(-50%, 0); }
  .wave { display: flex; align-items: center; gap: 3px; height: 18px; }
  .wave i { width: 3px; border-radius: 2px; background: #5EEAD4; display: block; height: 6px; animation: wv .9s ease-in-out infinite; }
  .wave i:nth-child(2) { animation-delay: .12s; }
  .wave i:nth-child(3) { animation-delay: .24s; }
  .wave i:nth-child(4) { animation-delay: .36s; }
  .wave.idle i { animation: none; height: 4px; background: #7DD3C8; }
  @keyframes wv { 0%,100% { height: 5px; } 50% { height: 16px; } }
  .spinner {
    width: 16px; height: 16px; border-radius: 50%;
    border: 2px solid rgba(255,255,255,.2);
    border-top-color: #5EEAD4;
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .capsule .txt { font-size: 13px; letter-spacing: .2px; }
  .capsule .kbd {
    font-size: 11px; color: #A1A1A6; border: 1px solid #3A3A3C;
    padding: 1px 6px; border-radius: 5px;
  }
  .capsule .split { width: 1px; height: 18px; background: #3A3A3C; }
  .capsule .result { display: flex; flex-direction: column; gap: 3px; }
  .capsule .result b { font-size: 13px; font-weight: 600; }
  .capsule .result span { font-size: 11.5px; color: #B9B9BE; }

  .toast {
    position: absolute; left: 50%; bottom: 34px; transform: translate(-50%, 16px);
    display: flex; align-items: center; gap: 14px;
    background: #fff; border: 1px solid var(--line);
    padding: 10px 12px 10px 16px; border-radius: 10px;
    box-shadow: 0 12px 30px rgba(20,30,28,.14);
    font-size: 12.5px; color: var(--text);
    opacity: 0; pointer-events: none;
    transition: opacity .18s, transform .2s;
    z-index: 38;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
  .toast .undo { color: var(--accent-strong); font-weight: 600; font-size: 12.5px; padding: 4px 8px; border-radius: 6px; }
  .toast .undo:hover { background: var(--accent-soft); }

  .banner {
    position: absolute; top: 58px; right: 18px; width: 348px;
    background: rgba(28,28,30,.92);
    -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px);
    border-radius: 14px; color: #fff;
    padding: 12px 14px;
    box-shadow: 0 16px 40px rgba(0,0,0,.3);
    transform: translateY(-14px); opacity: 0; pointer-events: none;
    transition: opacity .2s, transform .26s cubic-bezier(.2,.9,.3,1.1);
    z-index: 60;
  }
  .banner.show { opacity: 1; transform: translateY(0); pointer-events: auto; }
  .bn-head { display: flex; gap: 10px; align-items: center; margin-bottom: 8px; }
  .bn-icon {
    width: 30px; height: 30px; border-radius: 8px; background: var(--accent);
    display: grid; place-items: center; font-size: 15px; font-weight: 700;
  }
  .bn-app { font-size: 11.5px; color: #C9C9CE; }
  .bn-time { font-size: 11px; color: #8E8E93; margin-left: auto; }
  .bn-title { font-size: 13.5px; font-weight: 600; margin-bottom: 2px; }
  .bn-body { font-size: 12.5px; color: #D2D2D7; }
  .bn-actions { display: flex; gap: 8px; margin-top: 11px; }
  .bn-actions button {
    flex: 1; height: 27px; border-radius: 7px; font-size: 12px;
    background: rgba(255,255,255,.13); color: #fff;
  }
  .bn-actions button:hover { background: rgba(255,255,255,.22); }
  .bn-actions button.primary { background: var(--accent); }
  .bn-actions button.primary:hover { background: #12A99B; }

  .scrim {
    position: absolute; inset: 0; background: rgba(20,24,23,.24);
    opacity: 0; pointer-events: none; transition: opacity .18s; z-index: 48;
  }
  .scrim.show { opacity: 1; pointer-events: auto; }

  .confirm {
    position: absolute; left: 50%; top: 50%;
    width: 520px; background: #fff; border-radius: 14px;
    box-shadow: 0 30px 80px rgba(0,0,0,.28);
    transform: translate(-50%, -46%) scale(.98);
    opacity: 0; pointer-events: none;
    transition: opacity .18s, transform .22s cubic-bezier(.2,.9,.3,1.1);
    z-index: 50; padding: 22px 24px 18px;
  }
  .confirm.show { opacity: 1; transform: translate(-50%, -50%) scale(1); pointer-events: auto; }
  .cf-label { font-size: 11px; font-weight: 600; color: var(--text3); letter-spacing: .3px; margin-bottom: 6px; }
  .cf-title { font-size: 17px; font-weight: 650; margin-bottom: 12px; }
  .cf-raw {
    font-size: 12.5px; color: var(--text2); line-height: 1.6;
    background: #F7F7F4; border-radius: 8px; padding: 9px 11px;
    margin-bottom: 18px;
  }
  .cf-field { margin-bottom: 14px; }
  .cf-input {
    width: 100%; height: 36px; border-radius: 8px; border: 1px solid var(--line-strong);
    padding: 0 11px; font: inherit; font-size: 13px; color: var(--text);
    background: #FCFCFA; outline: none;
  }
  .cf-input:focus { border-color: var(--accent); background: #fff; box-shadow: 0 0 0 3px rgba(13,148,136,.12); }
  .cf-row { display: flex; gap: 12px; }
  .cf-row .cf-field { flex: 1; }
  .cf-hint { font-size: 11.5px; color: var(--danger); margin-top: 6px; }
  .cf-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 20px; }
  .cf-actions .btn { height: 32px; padding: 0 16px; }

  .foot {
    width: 1180px; max-width: 100%;
    margin-top: 16px; display: flex; gap: 18px; align-items: center;
    font-size: 12px; color: #8A8A85;
  }
  .foot .sep { width: 1px; height: 12px; background: #D8D8D2; }
  .still * { transition: none !important; animation: none !important; }
  .foot b { font-weight: 600; color: #6C6C70; }
  @media (max-width: 1240px) {
    .window { height: 700px; }
    .detail { display: none; }
  }
</style>
</head>
<body>
<div class="stage">
  <div class="window">
    <div class="titlebar">
      <div class="lights"><i class="r"></i><i class="y"></i><i class="g"></i></div>
      <div class="app-name">Typetodo</div>
      <div class="spacer"></div>
      <div class="tools">
        <button class="btn" id="demoLow">低置信确认</button>
        <button class="btn" id="demoNotify">提醒横幅</button>
        <button class="btn primary" id="demoCapture"><kbd>⌘</kbd>语音捕获</button>
      </div>
    </div>

    <div class="body">
      <aside class="sidebar" id="sidebar"></aside>

      <main class="list-pane">
        <div class="list-head">
          <h1 id="viewTitle">今天</h1>
          <div class="sub" id="viewSub"></div>
          <div class="spacer"></div>
          <div class="hint" id="viewHint"></div>
        </div>
        <div class="list-scroll" id="list"></div>
      </main>

      <section class="detail" id="detail"></section>
    </div>
  </div>

  <div class="scrim" id="scrim"></div>

  <div class="capsule" id="capsule">
    <div class="wave" id="wave"><i></i><i></i><i></i><i></i></div>
    <div class="spinner" id="spinner" style="display:none"></div>
    <div class="txt" id="capsuleText">正在听…</div>
    <div class="split" id="capSplit"></div>
    <div class="kbd" id="capHint">松开结束</div>
  </div>

  <div class="toast" id="toast">
    <span id="toastText">已添加 3 条待办</span>
    <button class="undo" id="undoBtn">撤销</button>
  </div>

  <div class="banner" id="banner">
    <div class="bn-head">
      <div class="bn-icon">T</div>
      <div>
        <div class="bn-app">Typetodo</div>
      </div>
      <div class="bn-time">现在</div>
    </div>
    <div class="bn-title" id="bnTitle">交周报</div>
    <div class="bn-body" id="bnBody">今天 15:00 · 工作</div>
    <div class="bn-actions">
      <button class="primary" id="bnDone">完成</button>
      <button id="bnSnooze">稍后 1 小时</button>
    </div>
  </div>

  <div class="confirm" id="confirm">
    <div class="cf-label">这条没听准，确认一下</div>
    <div class="cf-title">找李工聊接口</div>
    <div class="cf-raw">听到的是「过几天找李工聊聊那个接口」</div>
    <div class="cf-field">
      <div class="cf-label">标题</div>
      <input class="cf-input" id="cfTitle" value="找李工聊接口">
    </div>
    <div class="cf-row">
      <div class="cf-field">
        <div class="cf-label">时间</div>
        <input class="cf-input" id="cfDue" placeholder="未识别到具体时间">
        <div class="cf-hint">说的是「过几天」，无法确定具体日期</div>
      </div>
      <div class="cf-field">
        <div class="cf-label">清单</div>
        <input class="cf-input" value="工作">
      </div>
    </div>
    <div class="cf-actions">
      <button class="btn" id="cfDiscard">丢弃</button>
      <button class="btn primary" id="cfSave">保存为待办</button>
    </div>
  </div>
</div>

<div class="foot">
  <b>Typetodo 原型 v0.1</b>
  <span class="sep"></span>
  <span>点击左侧切换视图 · 点行的圆圈可完成</span>
  <span class="sep"></span>
  <span>右上角三个按钮演示新功能</span>
</div>

<script>
const todos = [
  { id:'t1', title:'把 Q3 数据发给财务', bucket:'overdue', due:'昨天 09:00', day:'昨天', list:'工作', raw:'昨天就该发的那个 Q3 数据给财务', remind:true },
  { id:'t2', title:'回复张总的邮件', bucket:'overdue', due:'昨天 18:00', day:'昨天', list:'工作', raw:'回复张总那封关于预算的邮件', remind:false },
  { id:'t3', title:'交周报', bucket:'today', due:'今天 15:00', day:'今天', list:'工作', raw:'明天下午三点把周报发给张总，记得附上 Q3 数据', remind:true },
  { id:'t4', title:'约牙医', bucket:'today', due:'今天 10:30', day:'今天', list:'生活', raw:'约一下牙医，最近那颗牙有点疼', remind:true },
  { id:'t5', title:'整理会议纪要', bucket:'today', due:'今天', day:'今天', list:'工作', raw:'把今天上午的会议纪要整理一下发群里', remind:false, allDay:true },
  { id:'t6', title:'买咖啡豆', bucket:'inbox', due:'', day:'', list:'', raw:'买咖啡豆', remind:false },
  { id:'t7', title:'查一下那个 JSON 解析报错', bucket:'inbox', due:'', day:'', list:'', raw:'查一下那个 JSON 解析报错到底怎么回事', remind:false },
  { id:'t8', title:'给妈妈打电话', bucket:'inbox', due:'', day:'', list:'生活', raw:'周末给妈妈打个电话', remind:false },
  { id:'t9', title:'评审 PR #142', bucket:'upcoming', sort:1, due:'明天 11:00', day:'明天', list:'工作', raw:'明天十一点评审一下 142 号 PR', remind:true },
  { id:'t10', title:'续签域名', bucket:'upcoming', sort:2, due:'10月28日', day:'10月28日', list:'工作', raw:'十月底之前把域名续了', remind:true, allDay:true },
  { id:'t11', title:'订下周的机票', bucket:'upcoming', sort:4, due:'10月30日', day:'10月30日', list:'生活', raw:'订下周五去上海的机票', remind:false, allDay:true }
];
let done = [];
let view = 'today';
let selected = null;
let lastBatch = null;
let toastTimer = null;

const icons = {
  inbox:'<svg viewBox="0 0 24 24"><path d="M4 13h4l2 3h4l2-3h4"/><path d="M5 5h14l2 8v5a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-5z"/></svg>',
  today:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6L17 7M7 17l-1.4 1.4"/></svg>',
  upcoming:'<svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M8 3v4M16 3v4M3.5 10h17"/></svg>',
  list:'<svg viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12"/><path d="M4 6h.01M4 12h.01M4 18h.01"/></svg>',
  check:'<svg viewBox="0 0 24 24"><path d="M4 12.5l5 5L20 6.5"/></svg>',
  gear:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M18.8 5.2l-1.4 1.4M6.6 17.4l-1.4 1.4"/></svg>'
};

const views = {
  today:    { title:'今天', hint:'⌘ + 左键长按 记一条', filter: t => (t.bucket==='overdue'||t.bucket==='today') && !isDone(t.id) },
  inbox:    { title:'收件箱', sub:'还没安排时间的待办', hint:'说一句就能加', filter: t => t.bucket==='inbox' && !isDone(t.id) },
  upcoming: { title:'即将', sub:'未来 7 天', hint:'按天分组', filter: t => t.bucket==='upcoming' && !isDone(t.id) },
  work:     { title:'工作', hint:'', filter: t => t.list==='工作' && !isDone(t.id) },
  life:     { title:'生活', hint:'', filter: t => t.list==='生活' && !isDone(t.id) },
  completed:{ title:'已完成', sub:'保留 7 天', hint:'', filter: t => isDone(t.id) }
};

function isDone(id) { return done.includes(id); }

function counts() {
  const open = todos.filter(t => !isDone(t.id));
  return {
    inbox: open.filter(t=>t.bucket==='inbox').length,
    today: open.filter(t=>t.bucket==='today'||t.bucket==='overdue').length,
    upcoming: open.filter(t=>t.bucket==='upcoming').length,
    work: open.filter(t=>t.list==='工作').length,
    life: open.filter(t=>t.list==='生活').length,
    completed: done.length
  };
}

function renderSidebar() {
  const c = counts();
  const item = (key, icon, label, count, cls='') =>
    `<div class="side-item ${view===key?'active':''} ${cls}" data-view="${key}">
       <span class="ic">${icons[icon]}</span><span class="label">${label}</span>
       ${count!==undefined?`<span class="count">${count}</span>`:''}
     </div>`;
  document.getElementById('sidebar').innerHTML = `
    ${item('inbox', 'inbox', '收件箱', c.inbox)}
    ${item('today', 'today', '今天', c.today)}
    ${item('upcoming', 'upcoming', '即将', c.upcoming)}
    <div class="side-title">清单</div>
    ${item('work', 'list', '<span class="dot" style="background:#0D9488"></span>工作', c.work)}
    ${item('life', 'list', '<span class="dot" style="background:#E8A33D"></span>生活', c.life)}
    <div class="side-item" style="color:#9A9A9F" data-view="newlist">
      <span class="ic"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></span>
      <span class="label">新建清单</span>
    </div>
    <div class="side-foot">
      ${item('completed', 'check', '已完成', c.completed)}
      <div class="side-item" data-view="settings">
        <span class="ic">${icons.gear}</span><span class="label">设置</span>
      </div>
    </div>`;
  document.querySelectorAll('.side-item').forEach(el => {
    el.onclick = () => { const v = el.dataset.view; if (views[v]) { view = v; selected = null; render(); } };
  });
}

function groupOf(t) {
  if (view === 'upcoming') return t.day || '某天';
  if (view === 'completed') return '已完成';
  return '';
}

function renderList() {
  const v = views[view];
  const items = todos.filter(v.filter);
  const head = document.getElementById('list');
  document.getElementById('viewTitle').textContent = v.title;
  if (view === 'today') {
    const over = items.filter(t=>t.bucket==='overdue').length;
    const tod = items.filter(t=>t.bucket==='today').length;
    document.getElementById('viewSub').textContent = over ? `逾期 ${over} · 今日 ${tod}` : `今日 ${tod}`;
  } else {
    document.getElementById('viewSub').textContent = v.sub || `${items.length} 条`;
  }
  document.getElementById('viewHint').textContent = v.hint || '';

  if (!items.length) {
    head.innerHTML = `<div style="padding:56px 10px;color:#9A9A9F;font-size:13px;text-align:center">这里空了</div>`;
    return;
  }

  if (view === 'today') {
    const over = items.filter(t=>t.bucket==='overdue');
    const tod  = items.filter(t=>t.bucket==='today');
    head.innerHTML =
      (over.length ? `<div class="group-head overdue">已逾期 <span class="n">${over.length}</span></div>${over.map(rowHTML).join('')}` : '') +
      `<div class="group-head">今天 <span class="n">${tod.length}</span></div>${tod.map(rowHTML).join('')}`;
  } else if (view === 'upcoming') {
    const days = [];
    items.forEach(t => { if (!days.some(d => d.name === t.day)) days.push({ name: t.day, sort: t.sort || 9 }); });
    days.sort((a, b) => a.sort - b.sort);
    head.innerHTML = days.map(d => `<div class="group-head">${d.name}</div>${items.filter(t=>t.day===d.name).map(rowHTML).join('')}`).join('');
  } else {
    head.innerHTML = items.map(rowHTML).join('');
  }
  bindRows();
}

function rowHTML(t) {
  const d = isDone(t.id);
  const over = t.bucket === 'overdue';
  return `<div class="row ${d?'done':''} ${selected===t.id?'selected':''}" data-id="${t.id}">
    <button class="check" data-check="${t.id}" aria-label="完成">${icons.check}</button>
    <div class="row-main">
      <div class="row-title">${t.title}</div>
      <div class="row-meta">
        ${t.due ? `<span class="due ${over?'overdue':''}">${t.due}</span>` : `<span>未安排时间</span>`}
        ${t.list ? `<span class="sep"></span><span>${t.list}</span>` : ''}
      </div>
    </div>
    <div class="row-right">${t.remind ? '<span class="pill">提醒</span>' : ''}${over ? '<span class="pill warn">逾期</span>' : ''}</div>
  </div>`;
}

function bindRows() {
  document.querySelectorAll('.row').forEach(el => {
    el.onclick = (e) => {
      if (e.target.closest('[data-check]')) return;
      selected = el.dataset.id; render();
    };
  });
  document.querySelectorAll('[data-check]').forEach(el => {
    el.onclick = (e) => {
      e.stopPropagation();
      const id = el.dataset.check;
      if (isDone(id)) done = done.filter(x=>x!==id); else done.push(id);
      render();
    };
  });
}

function renderDetail() {
  const el = document.getElementById('detail');
  const t = todos.find(x => x.id === selected);
  if (!t) {
    el.innerHTML = `<div class="empty">选一条待办看详情<span class="k">回车可以快速完成</span></div>`;
    return;
  }
  el.innerHTML = `
    <div class="d-title">${t.title}</div>
    <div class="d-chips">
      ${t.due ? `<span class="chip ${t.bucket==='overdue'?'danger':'accent'}">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg>${t.due}</span>` : `<span class="chip add">＋ 添加时间</span>`}
      ${t.list ? `<span class="chip"><svg viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12"/><path d="M4 6h.01M4 12h.01M4 18h.01"/></svg>${t.list}</span>` : ''}
    </div>
    <div class="d-section">
      <div class="d-label">原始语音</div>
      <div class="quote">「${t.raw}」</div>
    </div>
    <div class="d-section">
      <div class="d-label">提醒</div>
      <div class="d-row"><span class="k">${t.allDay ? '当天 09:00' : (t.due ? '到点提醒' : '未设置')}</span>${t.remind?'<span class="switch"></span>':''}</div>
    </div>
    <div class="d-actions">
      <button class="btn" id="dDone">${isDone(t.id)?'恢复待办':'标记完成'}</button>
      <button class="btn danger" id="dDel">删除</button>
    </div>`;
  document.getElementById('dDone').onclick = () => {
    if (isDone(t.id)) done = done.filter(x=>x!==t.id); else done.push(t.id);
    render();
  };
  document.getElementById('dDel').onclick = () => {
    const i = todos.findIndex(x=>x.id===t.id);
    if (i>=0) todos.splice(i,1);
    selected = null; render();
  };
}

function ensureSelection() {
  const items = todos.filter(views[view].filter);
  if (!items.some(t => t.id === selected)) selected = items.length ? items[0].id : null;
}

function render() {
  ensureSelection();
  renderSidebar();
  renderList();
  renderDetail();
}

function showToast(text, undoable) {
  const toast = document.getElementById('toast');
  document.getElementById('toastText').textContent = text;
  document.getElementById('undoBtn').style.display = undoable ? '' : 'none';
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 5000);
}

document.getElementById('undoBtn').onclick = () => {
  if (lastBatch) {
    lastBatch.forEach(id => {
      const i = todos.findIndex(t=>t.id===id);
      if (i>=0) todos.splice(i,1);
    });
    lastBatch = null;
  }
  document.getElementById('toast').classList.remove('show');
  render();
};

function setCapsule(state, text) {
  const cap = document.getElementById('capsule');
  if (state === 'hide') { cap.classList.remove('show'); return; }
  cap.classList.add('show');
  const listening = state === 'listen';
  document.getElementById('wave').style.display = listening ? 'flex' : 'none';
  document.getElementById('spinner').style.display = listening ? 'none' : 'block';
  document.getElementById('capHint').style.display = listening ? '' : 'none';
  document.getElementById('capSplit').style.display = listening ? '' : 'none';
  document.getElementById('capsuleText').textContent = text;
}

let captureTimers = [];
function runCapture() {
  captureTimers.forEach(clearTimeout); captureTimers = [];
  setCapsule('listen', '正在听…');
  captureTimers.push(setTimeout(() => setCapsule('idle', '识别中…'), 900));
  captureTimers.push(setTimeout(() => setCapsule('idle', '整理成待办…'), 1500));
  captureTimers.push(setTimeout(() => {
    setCapsule('hide');
    const batch = [
      { id:'n1', title:'把周报发给张总', bucket:'upcoming', sort:1, due:'明天 15:00', day:'明天', list:'工作', raw:'明天下午三点把周报发给张总，记得附上 Q3 数据', remind:true },
      { id:'n2', title:'订下周三的会议室', bucket:'upcoming', sort:3, due:'10月29日', day:'10月29日', list:'工作', raw:'顺便订一下下周三的会议室', remind:false, allDay:true },
      { id:'n3', title:'买咖啡豆', bucket:'inbox', due:'', day:'', list:'', raw:'还有记得买咖啡豆', remind:false }
    ];
    batch.forEach(t => todos.unshift(t));
    lastBatch = batch.map(t=>t.id);
    view = 'upcoming'; selected = batch[0].id;
    render();
    showToast('已添加 3 条 · 其中 1 条进了收件箱', true);
  }, 2150));
}

document.getElementById('demoCapture').onclick = runCapture;

document.getElementById('demoNotify').onclick = () => {
  const b = document.getElementById('banner');
  b.classList.add('show');
  setTimeout(() => b.classList.remove('show'), 6500);
};
document.getElementById('bnDone').onclick = () => {
  document.getElementById('banner').classList.remove('show');
  showToast('已完成：交周报', false);
};
document.getElementById('bnSnooze').onclick = () => {
  document.getElementById('banner').classList.remove('show');
  showToast('已稍后：1 小时后提醒', false);
};

const confirmEl = document.getElementById('confirm');
const scrim = document.getElementById('scrim');
function openConfirm() { scrim.classList.add('show'); confirmEl.classList.add('show'); }
function closeConfirm() { scrim.classList.remove('show'); confirmEl.classList.remove('show'); }
document.getElementById('demoLow').onclick = openConfirm;
document.getElementById('cfDiscard').onclick = closeConfirm;
document.getElementById('cfSave').onclick = () => {
  const title = document.getElementById('cfTitle').value.trim() || '未命名待办';
  const t = { id:'c1', title, bucket:'inbox', due:'', day:'', list:'工作', raw:'过几天找李工聊聊那个接口', remind:false };
  todos.unshift(t); lastBatch = [t.id]; selected = t.id; view = 'inbox';
  closeConfirm(); render(); showToast('已添加 1 条 · 时间待定', true);
};
scrim.onclick = closeConfirm;

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeConfirm(); document.getElementById('banner').classList.remove('show'); }
  if (e.key === 'Enter' && selected && !confirmEl.classList.contains('show')) {
    if (isDone(selected)) done = done.filter(x=>x!==selected); else done.push(selected);
    render();
  }
});

const qs = new URLSearchParams(location.search);
if (qs.get('still')) document.body.classList.add('still');
if (qs.get('view') && views[qs.get('view')]) view = qs.get('view');
if (qs.get('select')) selected = qs.get('select');

render();

if (qs.get('demo') === 'capture') setTimeout(runCapture, 300);
if (qs.get('demo') === 'confirm') setTimeout(openConfirm, 300);
if (qs.get('demo') === 'notify') setTimeout(() => document.getElementById('demoNotify').click(), 300);

</script>
</body>
</html>
